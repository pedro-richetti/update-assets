name: Atualizar Tesouro Direto

on:
  schedule:
    - cron: '0 * * * *' # Executa a cada hora
  workflow_dispatch: # Permite executar manualmente no GitHub

jobs:
  update-data:
    runs-on: ubuntu-latest

    permissions:
      contents: write # Necessario para poder commitar e fazer push no repositorio

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas

      - name: Run script to update data
        run: python update_data.py

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add dados.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update dados.json" && git push)
