name: Atualizar Tesouro Direto

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 9 * * 1-5' # Executa às 06:00 BRT (09:00 UTC) de segunda a sexta
  workflow_dispatch: # Permite executar manualmente no GitHub

jobs:
  update-data:
    runs-on: ubuntu-latest

    permissions:
      contents: write # Necessario para poder commitar e fazer push no repositorio

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests

      - name: Run script to update data
        run: python update_data.py

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add dados.json
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "Update dados.json"
            success=0
            for i in {1..5}; do
              git pull --rebase && git push && success=1 && break || {
                git rebase --abort || true
                sleep 5
              }
            done
            if [ $success -eq 0 ]; then
              echo "Failed to push after 5 attempts."
              exit 1
            fi
          fi

  deploy:
    needs: update-data
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
