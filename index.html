<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tesouro Direto - Preços</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f7f6;
            color: #333;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: #fff;
            padding: 20px 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #1a5c40;
            margin-bottom: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #f8f9fa;
            font-weight: 600;
            color: #555;
        }
        tr:hover {
            background-color: #f1f5f4;
        }
        .valor {
            font-family: monospace;
            font-size: 1.1em;
            text-align: right;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
            font-style: italic;
        }
        .error {
            color: #d9534f;
            text-align: center;
            padding: 20px;
            background-color: #f9f2f2;
            border-radius: 4px;
        }
        .footer {
            margin-top: 20px;
            text-align: center;
            font-size: 0.85em;
            color: #888;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Cotações do Tesouro Direto</h1>
    <div id="content">
        <div class="loading">Carregando dados...</div>
    </div>
    <div class="footer">
        Atualizado automaticamente via GitHub Actions
    </div>
</div>

<script>
    async function carregarDados() {
        const contentDiv = document.getElementById('content');
        try {
            // Adicionando um timestamp na URL para evitar cache
            const response = await fetch('dados.json?t=' + new Date().getTime());
            if (!response.ok) {
                throw new Error('Falha ao carregar os dados. Status: ' + response.status);
            }

            const dados = await response.json();

            if (!dados || dados.length === 0) {
                contentDiv.innerHTML = '<div class="error">Nenhum dado encontrado no arquivo.</div>';
                return;
            }

            // Converter valor numérico para Moeda (BRL)
            const formatter = new Intl.NumberFormat('pt-BR', {
                style: 'currency',
                currency: 'BRL'
            });

            let tableHTML = `
                <table>
                    <thead>
                        <tr>
                            <th>Título</th>
                            <th style="text-align: right;">Valor de Venda</th>
                            <th>Data de Atualização</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            dados.forEach(item => {
                tableHTML += `
                    <tr>
                        <td><strong>${item.titulo}</strong></td>
                        <td class="valor">${formatter.format(item.venda)}</td>
                        <td>${item.atualizado}</td>
                    </tr>
                `;
            });

            tableHTML += `
                    </tbody>
                </table>
            `;

            contentDiv.innerHTML = tableHTML;

        } catch (error) {
            console.error('Erro ao buscar dados.json:', error);
            contentDiv.innerHTML = `<div class="error">Erro ao carregar dados: ${error.message}</div>`;
        }
    }

    // Executa ao carregar a página
    document.addEventListener('DOMContentLoaded', carregarDados);
</script>

</body>
</html>
